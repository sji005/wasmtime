name: Original fd_read memory isolation

on:
  workflow_dispatch:
  push:
    branches: ['flux/fd-read-memory-isolation']
    paths:
      - 'verification/flux/**'
      - 'crates/wiggle/**'
      - 'crates/wasi/**'
      - 'crates/wasi-io/**'
      - 'crates/wasmtime/src/runtime/memory.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/flux-fd-read.yml'

permissions:
  contents: read

concurrency:
  group: fd-read-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  environment:
    if: github.repository == 'sji005/wasmtime'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify frozen production sources
        run: |
          python3 verification/flux/check_sources.py
      - name: Install pinned Rust compiler
        run: |
          rustup toolchain install nightly-2026-10-22 --profile minimal --component rustfmt --component rust-src --component rustc-dev --component llvm-tools
          rustup default nightly-2026-10-22
      - name: Check harness and regression formatting
        run: rustfmt --edition 2024 --check verification/flux/smoke.rs verification/flux/file_read_specs.rs crates/wiggle/tests/fd_read_memory.rs
      - name: Restore pinned Flux and solvers
        id: flux-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.flux/sysroot
            ~/.cargo/bin/flux
            ~/.cargo/bin/cargo-flux
            ~/.cargo/bin/z3
            ~/.cargo/bin/fixpoint
          key: flux-fd-read-ubuntu24-x64-${{ hashFiles('verification/flux/install.sh', 'verification/flux/pins.json') }}
      - name: Bootstrap pinned checker and solvers
        if: steps.flux-cache.outputs.cache-hit != 'true'
        run: bash verification/flux/install.sh
      - name: Save pinned Flux and solvers
        if: steps.flux-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.flux/sysroot
            ~/.cargo/bin/flux
            ~/.cargo/bin/cargo-flux
            ~/.cargo/bin/z3
            ~/.cargo/bin/fixpoint
          key: ${{ steps.flux-cache.outputs.cache-primary-key }}
      - name: M0 arithmetic, slice and pointer acceptance and rejection
        run: python3 verification/flux/check_environment.py --output-dir artifacts/fd-read/environment
      - name: Collect original-body feasibility diagnostics (not a spatial proof)
        if: github.event_name == 'workflow_dispatch'
        run: python3 verification/flux/probe_original.py --case range --case memory-slice --case fd-read-caller --output-dir artifacts/fd-read/original-body-probes
      - name: Check narrow original-adapter source-slice experiment
        run: python3 verification/flux/check_adapter.py --output-dir artifacts/fd-read/adapter
      - name: Restore separate compatibility driver
        id: compatibility-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/fd-read-flux-compat
          key: flux-fd-read-compat-${{ hashFiles('verification/flux/toolchain/*.patch', 'verification/flux/toolchain/build_compat.sh', 'verification/flux/pins.json') }}
      - name: Build separate Flux selection-compatibility candidate
        run: bash verification/flux/toolchain/build_compat.sh
      - name: Cache compiled compatibility candidate
        if: steps.compatibility-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/fd-read-flux-compat
          key: ${{ steps.compatibility-cache.outputs.cache-primary-key }}
      - name: Compare baseline and candidate selection with rejected selected mutations
        run: python3 verification/flux/toolchain/check_selection.py
      - name: Require strict M0 acceptance and rejection with the candidate driver
        run: python3 verification/flux/check_environment.py --output-dir artifacts/fd-read/environment-compat
      - name: Compile narrow external file primitive specification
        run: python3 verification/flux/compile_primitive_specs.py
      - name: Diagnose field-wise std range-clone contract loading across crates
        run: python3 verification/flux/check_clone_specs.py
      - name: Validate cross-crate external specification loading
        run: python3 verification/flux/check_adapter.py --external-specs --output-dir artifacts/fd-read/adapter-external
      - name: Check original full-crate Unix adapter with the explicit primitive contract
        run: python3 verification/flux/probe_original.py --case unix-read-adapter --output-dir artifacts/fd-read/compat-adapter-original
      - name: Reject a well-typed adapter mutation in a temporary full source copy
        run: python3 verification/flux/check_adapter_original.py
      - name: Collect original-body diagnostics with the candidate driver
        run: python3 verification/flux/probe_original.py --output-dir artifacts/fd-read/compat-original-body-probes
      - name: Reject well-typed pointer and range mutations in full source snapshots
        run: python3 verification/flux/check_original_contracts.py
      - name: Isolate native async trait support with well-typed result mutations
        run: python3 verification/flux/toolchain/check_async.py
      - name: Check associated-field normalization and reject a wrong postcondition
        run: python3 verification/flux/toolchain/check_projection.py
      - name: Retain complete environment diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fd-read-environment
          path: artifacts/fd-read/environment
          if-no-files-found: warn
      - name: Retain actual compiler invocations and open diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fd-read-original-body-probes
          path: artifacts/fd-read/original-body-probes
          if-no-files-found: warn
      - name: Retain narrow adapter experiment and diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fd-read-adapter-experiment
          path: artifacts/fd-read/adapter
          if-no-files-found: warn
      - name: Retain checker patch, compatibility regressions and original-body diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fd-read-compatibility
          path: |
            artifacts/fd-read/compat-toolchain
            artifacts/fd-read/compat-selection
            artifacts/fd-read/compat-projection
            artifacts/fd-read/compat-async
            artifacts/fd-read/environment-compat
            artifacts/fd-read/file-primitive-specs
            artifacts/fd-read/clone-primitive-specs
            artifacts/fd-read/adapter-external
            artifacts/fd-read/compat-adapter-original
            artifacts/fd-read/adapter-original-mutation
            artifacts/fd-read/compat-original-body-probes
            artifacts/fd-read/original-contract-mutations
          if-no-files-found: warn

  integration:
    if: github.repository == 'sji005/wasmtime'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install matching Rust compiler
        run: |
          rustup toolchain install nightly-2026-10-22 --profile minimal
          rustup default nightly-2026-10-22
      - name: Compile original Wiggle and WASI P1 configuration
        run: |
          cargo check --locked --target x86_64-unknown-linux-gnu -p wiggle --all-features
          cargo check --locked --target x86_64-unknown-linux-gnu -p wasmtime-wasi --no-default-features --features p1
      - name: Run original-body memory boundary regressions
        run: cargo test --locked --target x86_64-unknown-linux-gnu -p wiggle --all-features --test fd_read_memory
      - name: Capture fresh generated P1 ABI wrapper
        run: |
          mkdir -p artifacts/fd-read/glue
          cargo rustc --locked --target x86_64-unknown-linux-gnu -p wasmtime-wasi --no-default-features --features p1 --lib -- -Zunpretty=expanded > artifacts/fd-read/glue/wasi-expanded.rs
          python3 verification/flux/capture_glue.py artifacts/fd-read/glue/wasi-expanded.rs --output-dir artifacts/fd-read/glue
      - name: Retain full expansion and source provenance
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fd-read-original-glue
          path: artifacts/fd-read/glue
          if-no-files-found: warn
      - name: Exercise metadata and result boundaries through the generated binding
        run: |
          rustup target add wasm32-wasip1 wasm32-unknown-unknown
          cargo test --locked --target x86_64-unknown-linux-gnu -p wasmtime-wasi --no-default-features --features p1 --test fd_read_memory
