name: Flux memory verification

on:
  workflow_dispatch:
  push:
    branches: ['flux/**']
    paths:
      - 'crates/wiggle/**'
      - 'crates/wasi/src/p1.rs'
      - 'crates/wasi/Cargo.toml'
      - 'crates/wasi/src/filesystem.rs'
      - 'crates/wasi/src/filesystem/unix.rs'
      - 'crates/wasi/src/runtime.rs'
      - 'crates/wasi/witx/p1/wasi_snapshot_preview1.witx'
      - 'crates/wasi/witx/p1/typenames.witx'
      - 'verification/flux/*.rs'
      - 'verification/flux/*.py'
      - 'verification/flux/*.sh'
      - 'verification/flux/inventory.json'
      - 'verification/flux/evidence/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/flux-bounds.yml'

permissions:
  contents: read

jobs:
  proofs:
    if: github.repository == 'sji005/wasmtime'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Check P1 export accounting and call-site inventory
        run: python3 verification/flux/inventory.py --check
      - name: Install pinned Rust compiler
        run: |
          rustup toolchain install nightly-2026-10-22 --profile minimal --component rustfmt --component rust-src --component rustc-dev --component llvm-tools
          rustup default nightly-2026-10-22
          rustc --version --verbose
      - name: Check verified source formatting
        run: |
          rustfmt --edition 2024 --check crates/wiggle/src/bounds.rs crates/wiggle/src/memory_policy.rs verification/flux/bounds.rs verification/flux/effect_policy.rs verification/flux/production_memory.rs
      - name: Restore pinned Flux and solvers
        id: flux-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.flux/sysroot
            ~/.cargo/bin/flux
            ~/.cargo/bin/cargo-flux
            ~/.cargo/bin/z3
            ~/.cargo/bin/fixpoint
          key: flux-ubuntu24-x64-${{ hashFiles('verification/flux/install.sh') }}
      - name: Install pinned Flux and solvers
        if: steps.flux-cache.outputs.cache-hit != 'true'
        run: bash verification/flux/install.sh
      - name: Save pinned Flux and solvers
        if: steps.flux-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.flux/sysroot
            ~/.cargo/bin/flux
            ~/.cargo/bin/cargo-flux
            ~/.cargo/bin/z3
            ~/.cargo/bin/fixpoint
          key: ${{ steps.flux-cache.outputs.cache-primary-key }}
      - name: Prove production helper and reject broken versions
        run: python3 verification/flux/check.py
      - name: Check effect-policy encoding and reject unsafe models
        run: python3 verification/flux/check_effects.py
      - name: Prove production memory isolation and real-pointer consumers
        run: python3 verification/flux/check_production.py
  integration:
    if: github.repository == 'sji005/wasmtime'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install matching Rust compiler
        run: |
          rustup toolchain install nightly-2026-10-22 --profile minimal
          rustup default nightly-2026-10-22
      - name: Run supplementary execution regressions
        run: |
          rustc --edition=2024 --test verification/flux/bounds.rs -o "$RUNNER_TEMP/wiggle-bounds-tests"
          "$RUNNER_TEMP/wiggle-bounds-tests"
          rustc --edition=2024 --test verification/flux/effect_policy.rs -o "$RUNNER_TEMP/wiggle-effect-tests"
          "$RUNNER_TEMP/wiggle-effect-tests"
      - name: Check Wiggle with the Flux compiler version
        run: cargo check --locked -p wiggle --all-features
      - name: Test guest memory access through Wiggle
        run: cargo test --locked -p wiggle --test bounds
      - name: Capture actual expanded fd_read ABI binding
        run: |
          cargo rustc --locked -p wasmtime-wasi --no-default-features --features p1 --lib -- -Zunpretty=expanded > "$RUNNER_TEMP/wasi-expanded.rs"
          python3 verification/flux/capture_glue.py "$RUNNER_TEMP/wasi-expanded.rs" --output-dir "$RUNNER_TEMP/fd-read-glue" --reference verification/flux/evidence/fd-read/evidence.json
      - name: Save expanded binding evidence
        uses: actions/upload-artifact@v7
        with:
          name: fd-read-glue
          path: ${{ runner.temp }}/fd-read-glue
          if-no-files-found: error
